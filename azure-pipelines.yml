trigger:
  branches:
    include:
      - main
      - develop

pr:
  branches:
    include:
      - main
      - develop

pool:
  name: 'Default'

variables:
  NODE_VERSION: '22'

stages:
  - stage: Test
    displayName: 'Run Serenity Tests'
    jobs:
      - job: RunTests
        displayName: 'API + UI Tests (Chromium & WebKit)'
        timeoutInMinutes: 60
        steps:
          - task: NodeTool@0
            displayName: 'Set up Node.js $(NODE_VERSION)'
            inputs:
              versionSpec: '$(NODE_VERSION)'

          - script: npm ci
            displayName: 'Install dependencies'

          - script: npx playwright install --with-deps
            displayName: 'Install Playwright browsers'

          - script: npm test -- tag="$(TAG_FILTER)" browsers="$(BROWSER_FILTER)"
            displayName: 'Run tests'
            condition: and(succeeded(), ne(variables['TAG_FILTER'], ''), ne(variables['BROWSER_FILTER'], ''))
            env:
              USER_EMAIL: $(USER_EMAIL)
              USER_PASSWORD: $(USER_PASSWORD)
              BASE_URL: $(BASE_URL)
              API_BASE_URL: $(API_BASE_URL)
              CLIENTE_ID: $(CLIENTE_ID)
              CLIENTE_SECRET: $(CLIENTE_SECRET)
              BEARER_TOKEN: $(BEARER_TOKEN)

          - script: npm test
            displayName: 'Run all tests (no filter)'
            condition: and(succeeded(), eq(variables['TAG_FILTER'], ''))
            env:
              USER_EMAIL: $(USER_EMAIL)
              USER_PASSWORD: $(USER_PASSWORD)
              BASE_URL: $(BASE_URL)
              API_BASE_URL: $(API_BASE_URL)
              CLIENTE_ID: $(CLIENTE_ID)
              CLIENTE_SECRET: $(CLIENTE_SECRET)
              BEARER_TOKEN: $(BEARER_TOKEN)

          - task: PublishHtmlReport@1
            displayName: 'Publish Serenity report'
            condition: always()
            inputs:
              reportDir: '$(System.DefaultWorkingDirectory)/target/site/serenity/report/index.html'
              tabName: 'Serenity Report'
