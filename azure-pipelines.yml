trigger:
  branches:
    include:
      - main
      - develop

pr:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: Default

variables:
  NODE_VERSION: '22'
  JAVA_VERSION: '17'

stages:
  - stage: Test
    displayName: 'Run Serenity Tests'
    jobs:
      - job: RunTests
        displayName: 'API + UI Tests (Chromium & WebKit)'
        timeoutInMinutes: 60
        steps:
          - task: JavaToolInstaller@0
            displayName: 'Set up Java $(JAVA_VERSION)'
            inputs:
              versionSpec: '$(JAVA_VERSION)'
              jdkArchitectureOption: 'x64'
              jdkSourceOption: 'PreInstalled'

          - task: NodeTool@0
            displayName: 'Set up Node.js $(NODE_VERSION)'
            inputs:
              versionSpec: '$(NODE_VERSION)'

          - script: npm ci
            displayName: 'Install dependencies'

          - script: npx playwright install --with-deps
            displayName: 'Install Playwright browsers'

          - script: npm test -- tag="$(TAG_FILTER)" browsers="$(BROWSER_FILTER)"
            displayName: 'Run tests'
            condition: and(succeeded(), ne(variables['TAG_FILTER'], ''), ne(variables['BROWSER_FILTER'], ''))
            env:
              USER_EMAIL: $(USER_EMAIL)
              USER_PASSWORD: $(USER_PASSWORD)
              BASE_URL: $(BASE_URL)
              API_BASE_URL: $(API_BASE_URL)
              CLIENTE_ID: $(CLIENTE_ID)
              CLIENTE_SECRET: $(CLIENTE_SECRET)
              BEARER_TOKEN: $(BEARER_TOKEN)

          - script: npm test
            displayName: 'Run all tests (no filter)'
            condition: and(succeeded(), eq(variables['TAG_FILTER'], ''))
            env:
              USER_EMAIL: $(USER_EMAIL)
              USER_PASSWORD: $(USER_PASSWORD)
              BASE_URL: $(BASE_URL)
              API_BASE_URL: $(API_BASE_URL)
              CLIENTE_ID: $(CLIENTE_ID)
              CLIENTE_SECRET: $(CLIENTE_SECRET)
              BEARER_TOKEN: $(BEARER_TOKEN)

          - script: npm run test:report
            displayName: 'Generate Serenity HTML report'
            condition: always()

          - task: PublishBuildArtifacts@1
            displayName: 'Upload report artifact'
            condition: always()
            inputs:
              PathtoPublish: 'target/site/serenity/report'
              ArtifactName: 'serenity-report'
