trigger:
  branches:
    include:
      - main
      - develop

pr:
  branches:
    include:
      - main
      - develop

pool:
  name: 'Default'

variables:
  NODE_VERSION: '22'

stages:
  - stage: Test
    displayName: 'Run Serenity Tests'
    jobs:
      - job: RunTests
        displayName: 'API + UI Tests (Chromium & WebKit)'
        timeoutInMinutes: 60
        steps:
          - task: NodeTool@0
            displayName: 'Set up Node.js $(NODE_VERSION)'
            inputs:
              versionSpec: '$(NODE_VERSION)'

          - script: npm ci
            displayName: 'Install dependencies'

          - script: npx playwright install --with-deps
            displayName: 'Install Playwright browsers'

          - script: npm test -- tag="$(TAG_FILTER)" browsers="$(BROWSER_FILTER)"
            displayName: 'Run tests'
            condition: and(succeeded(), ne(variables['TAG_FILTER'], ''), ne(variables['BROWSER_FILTER'], ''))
            env:
              USER_EMAIL: $(USER_EMAIL)
              USER_PASSWORD: $(USER_PASSWORD)
              BASE_URL: $(BASE_URL)
              API_BASE_URL: $(API_BASE_URL)
              CLIENTE_ID: $(CLIENTE_ID)
              CLIENTE_SECRET: $(CLIENTE_SECRET)
              BEARER_TOKEN: $(BEARER_TOKEN)

          - script: npm test
            displayName: 'Run all tests (no filter)'
            condition: and(succeeded(), eq(variables['TAG_FILTER'], ''))
            env:
              USER_EMAIL: $(USER_EMAIL)
              USER_PASSWORD: $(USER_PASSWORD)
              BASE_URL: $(BASE_URL)
              API_BASE_URL: $(API_BASE_URL)
              CLIENTE_ID: $(CLIENTE_ID)
              CLIENTE_SECRET: $(CLIENTE_SECRET)
              BEARER_TOKEN: $(BEARER_TOKEN)

          - powershell: |
              $ErrorActionPreference = 'Continue'
              git config --global user.email "ci@pipeline.com"
              git config --global user.name "Azure Pipeline"

              $repoUrl = "https://$(GITHUB_PAT)@github.com/JuanDiegoValenciaDuque/Serenity-Screenplay-Playwright-Cucumber-TypeScript.git"
              $ghPagesDir = "$(Agent.TempDirectory)/gh-pages"

              git clone --branch gh-pages $repoUrl $ghPagesDir
              $cloneSuccess = $LASTEXITCODE -eq 0

              if (-not $cloneSuccess) {
                Write-Host "gh-pages branch not found, creating orphan branch..."
                git clone $repoUrl $ghPagesDir
                Set-Location $ghPagesDir
                git checkout --orphan gh-pages
                git rm -rf .
              } else {
                Set-Location $ghPagesDir
                Get-ChildItem -Exclude ".git" | Remove-Item -Recurse -Force
              }

              Copy-Item -Path "$(System.DefaultWorkingDirectory)/target/site/serenity/report/*" -Destination $ghPagesDir -Recurse -Force

              git add .
              git commit -m "Update Serenity report - Build $(Build.BuildNumber) [skip ci]"
              git push origin gh-pages
            displayName: 'Deploy report to GitHub Pages'
            condition: always()

          - powershell: |
              $url = "https://juandiegovalenciaduque.github.io/Serenity-Screenplay-Playwright-Cucumber-TypeScript/"
              $content = "## Serenity Test Report`n`n[Ver reporte completo]($url)"
              $summaryFile = "$(Build.ArtifactStagingDirectory)/summary.md"
              $content | Out-File -FilePath $summaryFile -Encoding utf8
              Write-Host "##vso[task.uploadsummary]$summaryFile"
            displayName: 'Add report link to pipeline summary'
            condition: always()
